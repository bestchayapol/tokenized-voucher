services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: voucherdb
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  
  backend:
    build: ./backend
    env_file: 
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: voucherdb
    volumes:
      - ./backend:/app

volumes:
  pgdata: 